<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ライブカメラ一覧</title>
<link rel="manifest" href="./manifest.webmanifest?v=16">
<link rel="icon" href="./icon-192.png?v=16">
<link rel="apple-touch-icon" href="./icon-192.png?v=16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ライブカメラ">
<meta name="theme-color" content="#2f6bff">
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1b1d27;--sub:#6b7080;--ac:#2f6bff;--line:#e2e4ec;--chip:#e8ecf8}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1d2029;--tx:#eceef5;--sub:#9aa0b2;--ac:#6c95ff;--line:#2d3140;--chip:#262b3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:0 16px 96px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
select,input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 select{display:none}.row2 input{flex:1}
#prefbtn{flex:1.1;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:6px;min-width:0}
#prefbtn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prefdlg{width:min(96vw,460px);padding:16px}
#prefdlg h3{font-size:14px;color:var(--sub);margin:12px 0 6px}
#prefdlg .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#prefdlg .pg button{background:var(--chip);color:var(--tx);padding:9px 2px;font-size:15px;line-height:1.2}
#prefdlg .pg button small{display:block;font-size:11px;color:var(--sub)}
#prefdlg .pg button.on{background:var(--ac);color:#fff}#prefdlg .pg button.on small{color:#fff}
#prefdlg .pg button.zero{opacity:.45}
#prefdlg .pbody{max-height:70vh;overflow:auto}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;background:var(--chip);color:var(--tx);padding:6px 12px;border-radius:999px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ac);color:#fff}
#areas{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
#areas[hidden]{display:none}
#areas button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-size:14px}
#areas button small{color:var(--sub);margin-left:3px;font-size:12px}
#areas button[aria-pressed="true"]{background:#1b1d27;color:#fff;border-color:#1b1d27}#areas button[aria-pressed="true"] small{color:#ddd}
#count{font-size:13px;color:var(--sub);margin-top:6px}
#grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:8px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{width:100%;height:100%;display:grid;place-items:center;color:#cfd6ea;font-size:14px;padding:8px;text-align:center;background:linear-gradient(135deg,#1f6fb8,#123a6b)}
.thumb .ph.mine{background:linear-gradient(135deg,#27304a,#12141b)}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:44px;text-shadow:0 2px 8px #0008}
.thumb .src{position:absolute;left:8px;top:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.thumb iframe,.thumb video{width:100%;height:100%;border:0;display:block;background:#000}
.meta{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.meta div{min-width:0}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{color:var(--sub)}
.acts{display:flex;gap:2px;flex:none}
.acts a,.acts button{background:none;color:var(--sub);padding:4px 8px;font-size:14px;text-decoration:none}
#more{display:block;margin:18px auto 0;width:100%;max-width:420px}
#more[hidden],#restore[hidden]{display:none!important}
#viewer{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;background:#000;z-index:50;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
#viewer .vbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#fff;background:#111}
#viewer .vbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
#viewer .vbar a,#viewer .vbar button{flex:none;color:#fff;background:#ffffff22;border-radius:10px;padding:8px 12px;font-size:15px;text-decoration:none}
#viewer .vbody{flex:1 1 auto;min-height:60vh;position:relative;background:#000}
#viewer .vbad{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#222e;color:#fff;border-radius:14px;padding:14px;font-size:15px;line-height:1.6;z-index:2}
#viewer .vbad .row{justify-content:flex-start;margin-top:10px}
#viewer .vbad button{font-size:15px}
#viewer .vload{position:absolute;left:0;right:0;top:40%;text-align:center;color:#ccd;font-size:15px;line-height:1.7;padding:0 16px}
#viewer .vbody iframe,#viewer .vbody video{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:transparent}
body.vopen{overflow:hidden}
.empty{color:var(--sub);text-align:center;padding:48px 8px}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
dialog select,dialog input{background:var(--bg)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#err{color:#d33;font-size:14px;min-height:20px;margin-top:8px}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
#restore{background:none;color:var(--sub);font-size:13px;padding:4px 0;text-decoration:underline}
#cats[hidden],#find[hidden]{display:none}
.chips button.now{background:#ffe3e3;color:#c0262d;font-weight:700}.chips button.now[aria-pressed="true"]{background:#e0353d;color:#fff}
.chips button.trash{background:transparent;border:1px solid var(--line);color:var(--sub)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:60;font-size:15px}
#toast[hidden]{display:none}
#toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:#fff;color:#222;padding:6px 12px;font-size:14px}
#trashdlg .tlist{max-height:60vh;overflow:auto;margin:10px 0}
#trashdlg .titem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
#trashdlg .titem div{flex:1;min-width:0}
#trashdlg .titem b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#trashdlg .titem small{color:var(--sub)}
#trashdlg .row button{white-space:nowrap;padding:9px 12px}
#trashdlg .titem button{white-space:nowrap;flex:none;padding:6px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="top"><div><h1>ライブカメラ一覧</h1><div id="ver" class="hint" style="margin-top:0">バージョン <b>v29</b>・<span id="total"></span></div></div><button id="add">＋ 追加</button></div>
  <div class="row2">
    <select id="pref" aria-label="県を選ぶ"></select>
    <button id="prefbtn" type="button"><span id="preftxt">全国</span>▾</button>
    <input id="q" type="search" placeholder="地名で探す" aria-label="地名で探す">
  </div>
  <div class="chips" id="chips">
    <button data-s="*" aria-pressed="true">すべて</button>
    <button data-s="now" aria-pressed="false" class="now">🔴 今配信中（お散歩・外配信）</button>
    <button data-s="yt" aria-pressed="false">YouTube</button>
    <button data-s="wn" aria-pressed="false">ウェザーニュース</button>
    <button data-s="ot" aria-pressed="false">道路・河川・観光など</button>
    <button data-s="me" aria-pressed="false">自分で追加</button>
    <button class="trash" id="trashbtn" type="button">🗑 ゴミ箱</button>
  </div>
  <div class="chips" id="cats"></div>
  <div id="areas" hidden></div>
  <div id="count"></div>
</header>
<div id="find" class="hint" hidden></div>
<div id="grid"></div>
<button id="more" class="ghost" hidden>もっと見る</button>
<div id="empty" class="empty" hidden></div>
<div id="viewer" hidden><div class="vbar"><b id="vname"></b><a id="vopen" target="_blank" rel="noopener noreferrer">開く</a><button id="vclose" aria-label="閉じる">✕ 閉じる</button></div><div class="vbody" id="vbody"></div></div>
<div id="toast" hidden><span id="toastmsg"></span><button id="toastundo" type="button">元に戻す</button></div>
<dialog id="prefdlg"><div class="top"><b>都道府県を選ぶ</b><button type="button" class="ghost" id="prefclose">閉じる</button></div><div class="pbody" id="pbody"></div></dialog>
<dialog id="trashdlg"><b>ゴミ箱</b><div class="hint" style="margin-top:4px">消したカメラはここに入ります。「元に戻す」で一覧に戻せます。</div>
<div class="tlist" id="tlist"></div>
<div class="row"><button type="button" class="ghost" id="trashempty">空にする</button><button type="button" class="ghost" id="trashall">全部戻す</button><button type="button" id="trashclose">閉じる</button></div></dialog>

<dialog id="dlg">
  <form method="dialog" id="f">
    <b>カメラを追加</b>
    <label for="nm">名前</label>
    <input id="nm" placeholder="例：徳島駅前" maxlength="30">
    <label for="fp">県</label>
    <select id="fp"></select>
    <label for="url">URL</label>
    <input id="url" inputmode="url" placeholder="https://…">
    <div class="hint">YouTube、映像ファイル（.mp4・.m3u8）、ライブカメラのサイトなど、ブラウザで見られる URL なら何でも登録できます。</div>
    <div id="err"></div>
    <div class="row">
      <button type="button" class="ghost" id="cancel">やめる</button>
      <button type="submit">追加</button>
    </div>
  </form>
</dialog>

<script>
(function(){
'use strict';
var PREFS=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
// 自動で集めたカメラ（2026-11-20。YouTube は配信中・埋め込みできると確かめた物、ウェザーニュースは県ごとの一覧に載っている物）
var DATA=/*DATA*/;
var KEY='zg_livecam_list2',SEL='zg_livecam_pref',HID='zg_livecam_hidden',SRC='zg_livecam_src';
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lw(k,v){try{localStorage.setItem(k,v)}catch(e){}}
// 自分で追加した分（前の版で自動登録した分 auto:1 は、新しい一覧に置き換えるので外す）
var mine=[];
try{mine=JSON.parse(ls(KEY)||'[]')}catch(e){}
if(!Array.isArray(mine))mine=[];
try{JSON.parse(ls('zg_livecam_list')||'[]').forEach(function(c){
  if(c&&c.id&&!mine.some(function(x){return x.url==='https://www.youtube.com/watch?v='+c.id}))
    mine.push({name:c.name,pref:'',url:'https://www.youtube.com/watch?v='+c.id});
})}catch(e){}
mine=mine.filter(function(c){return c&&!c.auto&&c.url});
function saveMine(){lw(KEY,JSON.stringify(mine))}
saveMine();
var hidden={};
try{(JSON.parse(ls(HID)||'[]')||[]).forEach(function(u){hidden[u]=1})}catch(e){}
function saveHidden(){lw(HID,JSON.stringify(Object.keys(hidden)))}
// ゴミ箱（消したカメラ）。自動で入れたカメラは hidden にも入れて一覧から隠す。空にしても hidden は残す（戻ってこない）
var TRASH='zg_livecam_trash';var trash=[];
try{trash=JSON.parse(ls(TRASH)||'[]')}catch(e){}
if(!Array.isArray(trash))trash=[];
function saveTrash(){lw(TRASH,JSON.stringify(trash))}

var preset=[];var trashInit=true;
DATA.yt.forEach(function(a){if(a[3]===1)return;preset.push({pref:PREFS[a[0]],name:a[1],url:'https://www.youtube.com/watch?v='+a[2],src:'yt'})});
(DATA.yc||[]).forEach(function(a){preset.push({pref:PREFS[a[0]],name:a[1],url:'https://www.youtube.com/channel/'+a[2]+'/live',src:'yt'})});
var OTN={road:'道路',highway:'高速道路',river:'河川',mount:'山',sea:'海',port:'港',snow:'スキー場',spot:'観光地',city:'街',rail:'駅・鉄道',airport:'空港',lake:'湖',sky:'空',animal:'動物',facility:'施設'};
(DATA.ot||[]).forEach(function(a){preset.push({pref:PREFS[a[0]],name:a[1],url:a[2],src:'ot',ty:OTN[a[3]]||''})});
DATA.wn.forEach(function(a){preset.push({pref:PREFS[a[0]],name:a[1],url:'https://weathernews.jp/onebox/livecam/'+a[2]+'/',src:'wn'})});

// 市町村（名前から決める。政令市の区は市にまとめる）
var MU=DATA.mu||{};
function areaOf(c){
  if(c.area!==undefined)return c.area;
  var pi=PREFS.indexOf(c.pref),a='';
  if(pi>=0){var t=c.name.split(c.pref).join(' ');var l=MU[pi]||[],bl=0,i,n,st;
    for(i=0;i<l.length;i++){n=l[i];if(t.indexOf(n)>=0&&n.length+10>bl){a=n;bl=n.length+10}}
    if(!a)for(i=0;i<l.length;i++){n=l[i];st=n.replace(/[市町村区]$/,'');if(st.length>=2&&t.indexOf(st)>=0&&st.length>bl){a=n;bl=st.length}}}
  c.area=a;return a;
}
function ytCh(s){var m=s.match(/youtube\.com\/channel\/(UC[\w-]{20,})\/live/);return m?m[1]:null}
function ytId(s){var m=s.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);return m?m[1]:null}
function kind(u){
  if(ytId(u))return 'yt';
  if(ytCh(u))return 'ytc';
  if(/\.m3u8(\?|#|$)/i.test(u))return 'hls';
  if(/\.(mp4|webm|mov)(\?|#|$)/i.test(u))return 'file';
  return 'page';
}
function host(u){try{return new URL(u).hostname}catch(e){return ''}}
var hlsP=null;
function loadHls(){
  if(window.Hls)return Promise.resolve();
  if(hlsP)return hlsP;
  hlsP=new Promise(function(ok,ng){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
    s.onload=ok;s.onerror=ng;document.head.appendChild(s);
  });
  return hlsP;
}

function trashFill(){
  if(!trashInit)return;trashInit=false;var have={};trash.forEach(function(t){have[t.url]=1});var add=0;
  preset.forEach(function(c){if(hidden[c.url]&&!have[c.url]){trash.push({name:c.name,pref:c.pref,url:c.url,src:c.src,at:0});add++}});
  if(add)saveTrash();
}
function all(){
  trashFill();
  var a=mine.map(function(c,i){return {pref:c.pref||'',name:c.name,url:c.url,src:'me',mi:i}});
  return a.concat(preset.filter(function(c){return !hidden[c.url]}));
}
var sel=document.getElementById('pref'),q=document.getElementById('q'),grid=document.getElementById('grid'),empty=document.getElementById('empty'),more=document.getElementById('more'),cnt=document.getElementById('count');
var srcSel=ls(SRC),PAGE=40,limit=PAGE;if(!srcSel||srcSel==='undefined')srcSel='*';
// 中身のカテゴリー。名前の言葉から決める（上から順に、最初に当たった物）
var CAT='zg_livecam_cat',catSel=ls(CAT);if(!catSel||catSel==='undefined')catSel='*';
var CATS=[['*','すべて'],['kojin','個人・自宅'],['machi','街・道路'],['eki','駅・鉄道'],['umi','海・港'],['kawa','川・湖・ダム'],['yama','山・高原'],['yuki','スキー・雪'],['sora','空港'],['kanko','観光・名所'],['doubutsu','動物'],['tenki','空・天気']];
var CATRULE=[
  ['doubutsu',/動物園|水族館|牧場|フクロウ|ふくろう|ペンギン|パンダ|カピバラ|アクアワールド|猫|ネコ|犬|イヌ|鳥|野鳥|馬|牛|羊|ゾウ|象/],
  ['yuki',/スキー|ゲレンデ|スノー|積雪|雪|snow/i],
  ['sora',/空港|飛行場|airport|滑走路/i],
  ['eki',/駅|鉄道|新幹線|電車|ホーム|踏切|線路|市電|路面電車/],
  ['kojin',/自宅|ベランダ|庭|窓|我が家|自室|部屋|定点|お散歩|散歩|街歩き|街ブラ|まちブラ|個人/],
  ['umi',/海|港|漁港|ビーチ|浜|岬|灯台|湾|マリン|サーフ|波|クルーズ|ふ頭|埠頭|海岸|フェリー/],
  ['kawa',/川|河口|河川|湖|ダム|滝|渓谷|水位|池|沼|用水|運河/],
  ['yama',/山|岳|高原|峠|富士|連峰|高地|渓/],
  ['kanko',/神社|神宮|大社|寺|城|タワー|温泉|観光|祭|宮|庭園|遺跡|公園|大仏|鳥居/],
  ['machi',/交差点|駅前|商店街|通り|街|道路|ドライブ|交通|国道|県道|信号|バイパス|市内|ロータリー/],
  ['tenki',/夜景|星空|星|天気|お天気|夕日|朝日|サンセット|sky|空/i]
];
function calcCat(n){for(var i=0;i<CATRULE.length;i++)if(CATRULE[i][1].test(n))return CATRULE[i][0];
  if(/ライブカメラ/.test(n)&&/(市|区|町|村)/.test(n)&&/(都|道|府|県)/.test(n))return 'kojin';return 'other'}
function catOf(c){return c._cat||(c._cat=(c.src==='wn'?'tenki':calcCat(c.name||'')))}
function fillSel(items){
  var c={};items.forEach(function(x){c[x.pref]=(c[x.pref]||0)+1});
  var cur=sel.value||ls(SEL)||'*';
  sel.textContent='';
  function opt(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)}
  opt('*','全国（'+items.length+'）');
  PREFS.forEach(function(p){opt(p,p+'（'+(c[p]||0)+'）')});
  if(c['']){opt('','県の指定なし（'+c['']+'）')}
  sel.value=cur;
  if(sel.value!==cur)sel.value='*';
  var pt=document.getElementById('preftxt');if(pt){var o=sel.options[sel.selectedIndex];pt.textContent=o?o.textContent:'全国'}
}
function paintChips(){
  [].forEach.call(document.querySelectorAll('#chips button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.s===srcSel))});
}
// カテゴリーの列を作る（今選んでいる出どころの中での件数つき）
function paintCats(items,hit){
  var box=document.getElementById('cats');box.textContent='';
  var c={},all=0;items.forEach(function(x){if(!hit(x,'cat'))return;all++;var k=catOf(x);c[k]=(c[k]||0)+1});
  CATS.forEach(function(C){
    var k=C[0],n=k==='*'?all:(c[k]||0);
    if(k!=='*'&&!n&&catSel!==k)return;
    var b=document.createElement('button');b.type='button';b.dataset.c=k;b.textContent=C[1];
    if(k!=='*'){var sm=document.createElement('small');sm.textContent=' '+n;b.appendChild(sm)}

// YouTube の再生が始まらない・エラーの時に知らせる（配信が止まった物など）
var ytWatch=null;
function stopYTWatch(){if(ytWatch){window.removeEventListener('message',ytWatch.on);clearTimeout(ytWatch.t);clearInterval(ytWatch.p);ytWatch=null}}
function watchYT(el,c,onerr){
  stopYTWatch();var w={ok:false};ytWatch=w;
  function hello(){try{el.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*')}catch(e){}}
  el.addEventListener('load',function(){hello()});w.p=setInterval(hello,1500);
  w.on=function(ev){if(ev.source!==el.contentWindow)return;var d;try{d=typeof ev.data==='string'?JSON.parse(ev.data):ev.data}catch(e){return}
    if(!d)return;
    if(d.event==='onError'){var code=+(d.info&&d.info.code!=null?d.info.code:d.info);
      if(onerr&&onerr(code)){return}
      showBad(c,'このカメラは今、アプリの中では再生できません（エラー'+code+'）。配信が止まっているか、YouTube 側で埋め込みが許可されていない可能性があります。「YouTubeで開く」では見られることがあります。');stopYTWatch();return}
    var st=d.info&&d.info.playerState;if(d.event==='onStateChange')st=d.info;
    if(st===1||st===3){w.ok=true;clearInterval(w.p);var b=vbody.querySelector('.vbad');if(b)b.remove()}
    if(st===0){showBad(c,'配信が終わりました。')}};
  window.addEventListener('message',w.on);
  w.t=setTimeout(function(){if(ytWatch===w&&!w.ok)showBad(c,'再生が始まりません。配信が止まっている可能性があります。映像の再生ボタンを押しても映らない時は、一覧から消してください。')},20000);
}
function showBad(c,msg){

  var r=document.createElement('div');r.className='row';
  var del=document.createElement('button');del.textContent='一覧から消す';
  del.onclick=function(){removeCam(c);closeViewer(true)};
  var keep=document.createElement('button');keep.className='ghost';keep.textContent='このまま見る';keep.style.color='#fff';
  keep.onclick=function(){b.remove()};
  var op=document.createElement('a');op.href=c.url;op.target='_blank';op.rel='noopener noreferrer';op.textContent='YouTubeで開く';
  op.style.cssText='display:inline-block;background:#ffffff22;color:#fff;border-radius:10px;padding:9px 14px;text-decoration:none;font-size:15px';
  if(/youtube\.com|youtu\.be/.test(c.url))r.insertBefore(op,r.firstChild);
  r.appendChild(del);r.appendChild(keep);b.appendChild(r);vbody.appendChild(b);

function removeCam(c){
  var t={name:c.name,pref:c.pref||'',url:c.url,src:c.src,at:Date.now()};
  if(c.src==='me'){var i=mine.findIndex(function(x){return x.url===c.url});if(i>=0){mine.splice(i,1);saveMine()}}
  else{hidden[c.url]=1;saveHidden()}
  trash=trash.filter(function(x){return x.url!==c.url});trash.unshift(t);saveTrash();
  render(true);showToast('「'+c.name+'」をゴミ箱に移しました',t);
}
function restoreCam(t){
  if(t.src==='me'){if(!mine.some(function(x){return x.url===t.url}))mine.unshift({name:t.name,pref:t.pref,url:t.url});saveMine()}
  else{delete hidden[t.url];saveHidden()}
  trash=trash.filter(function(x){return x.url!==t.url});saveTrash();
  render(true);
}
var toastT=null;

// YouTube の埋め込み。エラーの時は別の形（nocookie・参照元を変える・監視なし）で順に試す
function ytStart(th,c,k,n){
  var el=document.createElement('iframe'),host=n===1?'www.youtube-nocookie.com':'www.youtube.com';
  var base=k==='yt'?'https://'+host+'/embed/'+ytId(c.url)+'?':'https://'+host+'/embed/live_stream?channel='+ytCh(c.url)+'&';
  var yq='autoplay=1&mute=1&playsinline=1&rel=0';
  if(n<2)yq+='&enablejsapi=1&origin='+encodeURIComponent(location.origin);
  el.src=base+yq;
  el.referrerPolicy=n===0?'strict-origin-when-cross-origin':n===1?'origin':'unsafe-url';
  el.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';el.allowFullscreen=true;
  th.textContent='';th.appendChild(el);
  if(n<2)watchYT(el,c,function(code){
    // 100=見つからない・非公開は別の形でも同じ。101/150/153 などは埋め込みの設定の問題なので別の形を試す
    if(code===100||code===2||code===5)return false;
    ytStart(th,c,k,n+1);return true;
  });
  else stopYTWatch();
}
function play(th,c){
  var k=kind(c.url),el;
  if(c.src==='tc'){
    el=document.createElement('iframe');el.src='https://twitcasting.tv/'+encodeURIComponent(c.id)+'/embeddedplayer/live?auto_play=true&default_mute=true';
    el.allow='autoplay; fullscreen';el.allowFullscreen=true;th.appendChild(el);return;
  }
  if(k==='yt'||k==='ytc'){
    ytStart(th,c,k,0);return;
  }else if(k==='hls'||k==='file'){
    el=document.createElement('video');el.controls=true;el.autoplay=true;el.muted=true;el.playsInline=true;
    if(k==='file'||el.canPlayType('application/vnd.apple.mpegurl')){el.src=c.url}
    else loadHls().then(function(){
      if(window.Hls&&Hls.isSupported()){var h=new Hls();h.loadSource(c.url);h.attachMedia(el)}
      else el.src=c.url;
    }).catch(function(){th.textContent='再生の部品を読み込めませんでした。'});
  }else{
    el=document.createElement('iframe');el.src=c.url;
    el.allow='autoplay; fullscreen; picture-in-picture';el.allowFullscreen=true;
    el.referrerPolicy='no-referrer';
  }
  th.appendChild(el);
}
var SRCNAME={yt:'YouTube',wn:'ウェザーニュース',me:'自分で追加',ot:'ライブカメラ',tc:'ツイキャス',nico:'ニコ生'};

  d.appendChild(b);d.appendChild(sm);

// 今配信中（ツイキャスの外配信・ニコ生のお散歩・YouTube のお散歩ライブ）。開いた時に自分のサーバーの /live.json から取る
var NOW={at:0,items:null,loading:false,err:''};
function prefGuess(t){for(var i=0;i<PREFS.length;i++){var f=PREFS[i],s2=f==='北海道'?f:f.replace(/[都府県]$/,'');if(t.indexOf(f)>=0||t.indexOf(s2)>=0)return f}return ''}
function loadNow(force){
  if(NOW.loading)return;if(!force&&NOW.items&&Date.now()-NOW.at<120000)return;
  NOW.loading=true;
  fetch('/live.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    NOW.items=(j.items||[]).map(function(x){return {name:x.t||x.u||'配信中',pref:prefGuess((x.t||'')+' '+(x.u||'')),url:x.url,src:x.s,th:x.th,id:x.id,user:x.u||'',now:1}});
    NOW.at=Date.now();NOW.err='';
  }).catch(function(){NOW.err='今配信中の一覧を取れませんでした。少したってから開き直してください。'}).then(function(){NOW.loading=false;if(srcSel==='now')render(true)});
}
function renderNow(w,p){
  document.getElementById('cats').hidden=true;document.getElementById('areas').hidden=true;document.getElementById('find').hidden=true;
  loadNow(false);
  var list=(NOW.items||[]).filter(function(c){return !w||(c.name+' '+c.user+' '+c.pref).indexOf(w)>=0});
  list=list.filter(function(c){return c.pref}).concat(list.filter(function(c){return !c.pref}));
  if(PREFS.indexOf(p)>=0)list=list.filter(function(c){return c.pref===p}).concat(list.filter(function(c){return c.pref!==p}));
  grid.textContent='';
  list.slice(0,limit).forEach(function(c){grid.appendChild(card(c))});
  cnt.textContent=NOW.items?('今配信中 '+list.length+'件（開いた時に集めています。終わった配信は出ません）'):(NOW.err||'今配信中の配信を集めています…');
  more.hidden=list.length<=limit;more.textContent='もっと見る（残り'+Math.max(0,list.length-limit)+'件）';
  empty.hidden=!NOW.items||list.length>0;empty.textContent='今は条件に合う配信がありません。';
}
setInterval(function(){if(srcSel==='now'&&viewer.hidden&&!document.hidden){loadNow(true)}},180000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&srcSel==='now')loadNow(false)});
function render(keep){
  if(!keep)limit=PAGE;
  var items=all();
  document.getElementById('total').textContent='カメラ'+preset.length.toLocaleString()+'か所';
  fillSel(items);paintChips();
  var p=sel.value,w=q.value.trim();
  if(srcSel==='now'){renderNow(w,p);return}
  document.getElementById('cats').hidden=false;
  var fd=document.getElementById('find');
  fd.textContent='';
  fd.hidden=PREFS.indexOf(p)<0;
  if(!fd.hidden){
    fd.appendChild(document.createTextNode('もっと探す：'));
    [['YouTube','https://www.youtube.com/results?search_query='+encodeURIComponent(p+' ライブカメラ')+'&sp=EgJAAQ%253D%253D'],['Google','https://www.google.com/search?q='+encodeURIComponent(p+' ライブカメラ')]].forEach(function(l,i){
      if(i)fd.appendChild(document.createTextNode('　'));
      var a=document.createElement('a');a.href=l[1];a.target='_blank';a.rel='noopener noreferrer';a.textContent=l[0];fd.appendChild(a);
    });
    fd.appendChild(document.createTextNode('　→ 見つけた URL を「＋ 追加」で登録'));
  }
  // skip に入れた条件だけ外して判定（件数の数え直し用）
  function hit(c,skip){
    if(srcSel!=='*'&&c.src!==srcSel)return false;
    if(skip!=='cat'&&catSel!=='*'&&catOf(c)!==catSel)return false;
    if(w)return (c.name+' '+c.pref+' '+areaOf(c)).indexOf(w)>=0;
    if(p!=='*'&&c.pref!==p)return false;
    if(skip!=='area'&&areaSel&&p!=='*'&&areaKey(c)!==areaSel)return false;
    return true;
  }
  paintAreas(items,p,hit);
  paintCats(items,hit);
  var shown=items.filter(function(c){return hit(c,'')});
  grid.textContent='';
  shown.slice(0,limit).forEach(function(c){grid.appendChild(card(c))});
  cnt.textContent=(w?'全国から ':'')+shown.length+'件';

// 地域（市町村）の欄。少ない所は「その他」にまとめる
var AREA='zg_livecam_area',areaSel=ls(AREA)||'',areaBig={};
function areaKey(c){var a=areaOf(c);return a&&areaBig[a]?a:'その他'}
function paintAreas(items,p,hit){
  var box=document.getElementById('areas');box.textContent='';areaBig={};
  if(PREFS.indexOf(p)<0){box.hidden=true;return}
  var c={},n=0;items.forEach(function(x){if(x.pref!==p)return;n++;var a=areaOf(x);if(a)c[a]=(c[a]||0)+1});
  var min=n<100?2:3,list=Object.keys(c).filter(function(a){return c[a]>=min}).sort(function(a,b){return c[b]-c[a]});
  list.forEach(function(a){areaBig[a]=1});
  var other=n;list.forEach(function(a){other-=c[a]});
  if(!list.length){box.hidden=true;areaSel='';return}
  if(areaSel&&!(areaBig[areaSel]||(areaSel==='その他'&&other)))areaSel='';
  box.hidden=false;
  var f={},fn=0,fo=0;items.forEach(function(x){if(x.pref!==p||!hit(x,'area'))return;fn++;var k=areaKey(x);if(k==='その他')fo++;else f[k]=(f[k]||0)+1});

if('serviceWorker' in navigator&&window.isSecureContext){try{navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){}}
})();
