# 雑学王 じぶん専用サーバー（wrangler で デプロイ する ときの せってい）
name = "zatsugaku-push"
main = "zatsugaku-push.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "ZgRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ZgRelay"]

# Cron は 2026-11-18 に持ち主が削除（ニュースの先取りだけの用途。なくても /news は呼ばれた時に取る）。
# 戻す時は次の2行を足して デプロイ:
# [triggers]
# crons = ["* * * * *"]
